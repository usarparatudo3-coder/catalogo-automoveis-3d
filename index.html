
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Automóveis 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#10131a;color:#fff}
header{padding:28px 18px;text-align:center;background:linear-gradient(135deg,#111827,#263b59)}
header h1{margin:8px 0;color:#64b5ff}
header p{color:#d0d8e5}
main{max-width:1000px;margin:auto;padding:20px}
h2{margin-top:8px}
.carros{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{background:#1d2430;border:1px solid #374151;border-radius:18px;padding:16px;box-shadow:0 8px 20px #0005;transition:.25s}
.card:hover{transform:perspective(700px) rotateY(-3deg) translateY(-5px)}
.carro-img{height:155px;border-radius:12px;background:#303b4d;display:flex;align-items:center;justify-content:center;overflow:hidden}
.carro-img img{width:100%;height:100%;object-fit:cover}
.card h3{margin-bottom:8px}
.preco{font-size:23px;font-weight:bold;color:#69dba0}
.detalhes{color:#c5cedb;font-size:14px}
button,.contato{display:block;width:100%;border:0;border-radius:10px;padding:13px;margin-top:12px;background:#16834b;color:white;text-align:center;text-decoration:none;font-weight:bold;font-size:15px;cursor:pointer}
button:hover,.contato:hover{background:#20a761}
footer{text-align:center;color:#aab4c4;padding:26px}
</style>
</head>
<body>
<header>
<h1>🚘 CATÁLOGO AUTO 3D</h1>
<p>Encontre seu próximo carro!</p>
</header>
<main>
<h2>Veículos em destaque</h2>
<p style="color:#bdc7d6">Confira nossos modelos e entre em contato para consultar disponibilidade.</p>
<div class="carros" id="carros"></div>
</main>
<footer>Catálogo de Automóveis • Atendimento personalizado</footer>
<script>
const veiculos = [
 {nome:"SUV Moderno",ano:"2023",km:"35.000 km",preco:"R$ 109.900",foto:"https://images.unsplash.com/photo-1519641471654-76ce0107ad1b?auto=format&fit=crop&w=800&q=80"},
 {nome:"Sedã Executivo",ano:"2022",km:"42.000 km",preco:"R$ 89.900",foto:"https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80"},
 {nome:"Esportivo Premium",ano:"2024",km:"18.000 km",preco:"R$ 149.900",foto:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=800&q=80"}
];
const numeroWhatsApp = "5527999999999"; // Troque pelo seu número com código do Brasil
document.getElementById("carros").innerHTML = veiculos.map(c => `
 <article class="card">
  <div class="carro-img"><img src="${c.foto}" alt="${c.nome}" loading="lazy"></div>
  <h3>${c.nome}</h3>
  <p class="detalhes">Ano ${c.ano} • ${c.km}</p>
  <p class="preco">${c.preco}</p>
  <a class="contato" target="_blank" rel="noopener" href="https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent("Olá! Tenho interesse no veículo "+c.nome+". Está disponível?")}">Consultar no WhatsApp</a>
 </article>
`).join("");
</script>
</body>
</html>
